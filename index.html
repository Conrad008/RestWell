<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>restwell | dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root{
            --bg-main: #fff;
            --txt-main: #87CEEB;

        }
    </style>
</head>
<body>
    <header class="navbar">
        <h1>restwell</h1>
        <nav class="nav-links">
            <a href="#registration">join</a>
            <a href="#motivation">motivation</a>
        </nav>
    </header>
    <section id="registration">
        <form action="/submit-data" method="post">
            <fieldset>
                <legend>enter your details</legend>
                <div class="form">
                    <label for="name">your first name</label> 
                    <input type="text" id="name" required placeholder="jane/john">
                </div>
                <div class="form">
                    <label for="name">your last name</label>
                    <input type="text" id="name" required placeholder="doe">
                </div>
                <div class="form">
                    <label for="DOB">enter your date of birth</label>
                    <input type="number" id="DOB" required min="1" max="100">
                </div>
                <button class="button" type="submit">
                    submit
                </button>
            </fieldset>
        </form>
    </section>
    <section id="motivation">
        <div id="dashboardOutput" class="greetings">
            <h2 id="greeting">welcome</h2>
            <p id="AgeInMonths"></p>
        </div>

    </section>

</body>
</html>
