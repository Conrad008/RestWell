<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>restwell | dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1 class="text-3xl font-bold">Restwell</h1>
    </header>
    <main>
         <section id="registration" class="form">
        <form action="/submit-data" method="post">
            <fieldset class="forms">
                <h2 class="text-xl font-bold">enter your details</h2>
                <div class="font-bold" >
                    <label for="name">your first name</label> 
                    <input type="text" id="name" required placeholder="jane/john">
                </div> <br>
                <div class="form2 font-bold">
                    <label for="name">your last name</label>
                    <input type="text" id="name" required placeholder="doe">
                </div> <br>
                <div class="form3 font-bold">
                    <label for="age">enter your age</label>
                    <input type="number" id="age" required>
                </div> <br>
                <div class="form4 font-bold">
                    <label for="uemail">enter your email</label>
                    <input type="email" id="uemail" required placeholder="example@gmail.com">
                </div> <br>
                <button class="button" type="submit">
                    submit
                </button>
            </fieldset>
        </form>
    </section>
    <div id="dashboardOutput" class="hidden space-y-6">
        <section class="">
                <h2 id="greeting" class="text-2xl font-bold"></h2>
                <p id="ageInMonths" class="mt-2 font-medium"></p>
            </section>
            <section id="contentAccessSection" class="p-5 rounded-2xl border flex items-center gap-3">
                <div id="accessIcon" class="text-2xl"></div>
                <div>
                    <h3 id="accessTitle" class="font-bold text-lg"></h3>
                    <p id="accessMessage" class="text-sm mt-0.5"></p>
                </div>
            </section>
            <section class=" p-6 rounded-2xl shadow-sm">
                <h3 class="text-lg font-bold  mb-3 border-b pb-2">Daily Reminders</h3>
                <div id="quoteContainer" class="space-y-2.5"></div>
            </section>
            <button id="resetBtn" class="text-sm font-medium transition block mx-auto pt-2">
                Clear Stored Profile Data
            </button>
    </div>
    </main>
</body>
</html>
